<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 引入Bootstrap CSS -->

    <!-- 引入 Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <!-- 引入公共CSS -->
    <link rel="stylesheet" href="../css/common.css">
    <style>
        /* 系统日志页面专用样式 */
        .logs-container {
            padding: 20px;
        }
        .logs-filter {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .logs-table-container {
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .logs-table {
            margin-bottom: 0;
        }
        .logs-table th, .logs-table td {
            text-align: center;
            vertical-align: middle;
        }
        .logs-table tbody tr:hover {
            background-color: #f9f9f9;
        }
        .logs-pagination {
            padding: 15px;
            text-align: right;
            background-color: #f8f9fa;
            border-top: 1px solid #dee2e6;
        }
        .logs-actions {
            margin-top: 10px;
        }
        .logs-actions .btn {
            margin-left: 10px;
        }
        .logs-actions .btn:first-child {
            margin-left: 0;
        }
        .log-level-info {
            color: #17a2b8;
            font-weight: bold;
        }
        .log-level-warning {
            color: #ffc107;
            font-weight: bold;
        }
        .log-level-error {
            color: #dc3545;
            font-weight: bold;
        }
        .log-level-success {
            color: #28a745;
            font-weight: bold;
        }
        .log-type {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .log-type-auth {
            background-color: #e9ecef;
            color: #495057;
        }
        .log-type-operation {
            background-color: #d1ecf1;
            color: #0c5460;
        }
        .log-type-system {
            background-color: #f8d7da;
            color: #721c24;
        }
        .log-type-data {
            background-color: #d4edda;
            color: #155724;
        }
        .date-range-picker {
            display: flex;
            align-items: center;
        }
        .date-range-picker input {
            width: 150px;
        }
        .date-range-picker span {
            margin: 0 10px;
        }
    </style>
    <link rel="stylesheet" href="/css/chat-widget.css">
</head>

            <nav class="sidebar-nav">

                <div class="nav-item"><a href="/admin/student-management.html" class="nav-link"><i class="nav-icon fas fa-user-graduate"></i><span class="nav-text">学生管理</span></a></div>
                <div class="nav-item"><a href="/admin/teacher-management.html" class="nav-link"><i class="nav-icon fas fa-chalkboard-teacher"></i><span class="nav-text">教师管理</span></a></div>
                <div class="nav-item"><a href="/admin/course-management.html" class="nav-link"><i class="nav-icon fas fa-book"></i><span class="nav-text">课程管理</span></a></div>

                <div class="nav-item"><a href="/admin/department-management.html" class="nav-link"><i class="nav-icon fas fa-sitemap"></i><span class="nav-text">系部管理</span></a></div>

                <div class="nav-item"><a href="/admin/announcement-management.html" class="nav-link"><i class="nav-icon fas fa-bullhorn"></i><span class="nav-text">公告管理</span></a></div>

        <main class="main-content">

                <div class="nav-left">

                    <h1 class="page-title">系统日志</h1>
                </div>
                <div class="nav-right">
                    <button class="nav-icon-btn" id="notification-btn"><i class="fas fa-bell"></i><span class="badge"></span></button>
                    <div class="user-profile">
                        <div class="user-avatar"><i class="fas fa-user"></i></div>
                        <div class="user-info"><span class="user-name">管理员</span><span class="user-role">Admin</span></div>
                    </div>
                </div>
            </header>
            <div class="content-wrapper">
                <div class="logs-container">
                    <h2 class="page-header" style="margin-top:0;">系统日志</h2>
                    
                    <!-- 筛选条件区域 -->
                    <div class="logs-filter">
                        <form id="logsFilterForm">
                            <div class="row">
                                <div class="col-md-4">
                                    <label for="logLevel">日志级别：</label>
                                    <select class="form-control" id="logLevel">
                                        <option value="all">全部级别</option>
                                        <option value="info">信息(Info)</option>
                                        <option value="warning">警告(Warning)</option>
                                        <option value="error">错误(Error)</option>
                                        <option value="success">成功(Success)</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="logType">操作类型：</label>
                                    <select class="form-control" id="logType">
                                        <option value="all">全部类型</option>
                                        <option value="auth">认证登录</option>
                                        <option value="operation">操作行为</option>
                                        <option value="system">系统运行</option>
                                        <option value="data">数据变更</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="logUser">操作用户：</label>
                                    <input type="text" class="form-control" id="logUser" placeholder="请输入用户名">
                                </div>
                            </div>
                            <div class="row" style="margin-top: 15px;">
                                <div class="col-md-5">
                                    <label for="dateRangeStart">操作时间：</label>
                                    <div class="date-range-picker">
                                        <input type="date" class="form-control" id="dateRangeStart">
                                        <span>至</span>
                                        <input type="date" class="form-control" id="dateRangeEnd">
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <label for="logKeyword">关键词搜索：</label>
                                    <input type="text" class="form-control" id="logKeyword" placeholder="请输入关键词搜索">
                                </div>
                                <div class="col-md-3">
                                    <label style="visibility: hidden;">占位标签</label>
                                    <div class="logs-actions">
                                        <button type="button" class="btn btn-primary" onclick="searchLogs()">
                                            <span class="glyphicon glyphicon-search"></span> 搜索
                                        </button>
                                        <button type="button" class="btn btn-default" onclick="resetFilters()">
                                            <span class="glyphicon glyphicon-refresh"></span> 重置
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="row" style="margin-top: 15px;">
                                <div class="col-md-12 text-right">
                                    <button type="button" class="btn btn-success" onclick="exportLogs()">
                                        <span class="glyphicon glyphicon-export"></span> 导出日志
                                    </button>
                                    <button type="button" class="btn btn-danger" onclick="clearLogs()">
                                        <span class="glyphicon glyphicon-trash"></span> 清空日志
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                    
                    <!-- 统计卡片区域 -->
                    <div class="row" style="margin-bottom: 20px;">
                        <div class="col-md-3">
                            <div class="panel panel-info">
                                <div class="panel-heading">
                                    <h3 class="panel-title">日志总数</h3>
                                </div>
                                <div class="panel-body text-center">
                                    <span class="h2" id="totalLogCount">0</span>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="panel panel-success">
                                <div class="panel-heading">
                                    <h3 class="panel-title">成功操作</h3>
                                </div>
                                <div class="panel-body text-center">
                                    <span class="h2" id="successLogCount">0</span>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="panel panel-warning">
                                <div class="panel-heading">
                                    <h3 class="panel-title">警告日志</h3>
                                </div>
                                <div class="panel-body text-center">
                                    <span class="h2" id="warningLogCount">0</span>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="panel panel-danger">
                                <div class="panel-heading">
                                    <h3 class="panel-title">错误日志</h3>
                                </div>
                                <div class="panel-body text-center">
                                    <span class="h2" id="errorLogCount">0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 日志数据表格 -->

                                    <th style="width: 100px;">级别</th>
                                    <th style="width: 100px;">类型</th>

                                    <th style="width: 120px;">IP地址</th>
                                    <th>操作内容</th>

                        <!-- 分页控件 -->

    <!-- 日志详情弹窗 -->
    <div class="modal fade" id="logDetailModal" tabindex="-1" role="dialog" aria-labelledby="logDetailModalLabel">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">操作时间：</label>
                            <div class="col-sm-10">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">日志级别：</label>
                            <div class="col-sm-10">
                                <p class="form-control-static" id="detailLogLevel">--</p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">操作类型：</label>
                            <div class="col-sm-10">
                                <p class="form-control-static" id="detailLogType">--</p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">操作用户：</label>
                            <div class="col-sm-10">
                                <p class="form-control-static" id="detailLogUser">--</p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">IP地址：</label>
                            <div class="col-sm-10">
                                <p class="form-control-static" id="detailLogIp">--</p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">操作内容：</label>
                            <div class="col-sm-10">
                                <p class="form-control-static" id="detailLogContent">--</p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">请求路径：</label>
                            <div class="col-sm-10">
                                <p class="form-control-static" id="detailLogPath">--</p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">浏览器信息：</label>
                            <div class="col-sm-10">

                            </div>
                        </div>
                    </form>
                </div>

                    <button type="button" class="btn btn-default" data-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 成功提示框 -->
    <div class="alert alert-success fade in" role="alert" id="successAlert" style="display:none;">
        <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
        <strong>成功！</strong> <span id="successMessage"></span>
    </div>

    <!-- 错误提示框 -->
    <div class="alert alert-danger fade in" role="alert" id="errorAlert" style="display:none;">
        <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
        <strong>错误！</strong> <span id="errorMessage"></span>
    </div>

    <!-- 引入公共JS -->
    <script src="/js/common.js"></script>
    <script src="/js/app-api.js"></script>
    <script>
        // ============ API 调用和日志管理逻辑 ============
        var api = window.AppApi;
        const API = '/api/v1/operation-logs';
        let currentPage = 1, pageSize = 10, totalPages = 1;
        let searchKw = '';

        $(document).ready(function() {
            const endDate = new Date();
            const startDate = new Date();
            startDate.setDate(startDate.getDate() - 7);
            document.getElementById("dateRangeStart").valueAsDate = startDate;
            document.getElementById("dateRangeEnd").valueAsDate = endDate;
            loadLogs();
        });

        async function loadLogs(params = {}) {
            const query = { pageNum: currentPage, pageSize, ...params };
            try {
                const data = await api.get(API, query);
                const list = api.pageItems(data) || [];
                totalPages = Math.ceil((api.pageTotal(data) || 0) / pageSize);
                renderLogsTable(list);
                renderPagination(totalPages);
            } catch(e) { console.error('加载日志失败', e); }
        }

        function renderLogsTable(list) {
            const tbody = $('#logsTableBody').empty();
            if (!list.length) { tbody.append('<tr><td colspan="8" class="text-center text-muted">暂无日志数据</td></tr>'); return; }
            list.forEach(l => {
                const st = l.status === 1 ? '<span class="label label-success">成功</span>' : '<span class="label label-danger">失败</span>';
                tbody.append(`<tr>
                    <td>${l.id}</td><td>${l.operatorName||''}</td><td>${l.operationType||''}</td>
                    <td>${l.operationDesc||''}</td><td>${l.ipAddress||'-'}</td>
                    <td>${l.operationTime||''}</td><td>${st}</td>
                    <td><button class="btn btn-xs btn-danger" onclick="deleteLog(${l.id})">删除</button></td></tr>`);
            });
        }

        function renderPagination(total) {
            const pag = $('#logsPagination').empty();
            pag.append(`<li class="${currentPage===1?'disabled':''}"><a href="javascript:void(0)" onclick="goToPage(${currentPage-1})">&laquo;</a></li>`);
            for (let i = 1; i <= total && i <= 20; i++) {
                pag.append(`<li class="${i===currentPage?'active':''}"><a href="javascript:void(0)" onclick="goToPage(${i})">${i}</a></li>`);
            }
            pag.append(`<li class="${currentPage===total?'disabled':''}"><a href="javascript:void(0)" onclick="goToPage(${currentPage+1})">&raquo;</a></li>`);
        }

        function goToPage(p) { if (p<1||p>totalPages) return; currentPage=p; searchLogs(); }

        function searchLogs() {
            searchKw = $('#logKeyword').val().trim();
            const type = $('#logType').val();
            const startDate = $('#dateRangeStart').val();
            const endDate = $('#dateRangeEnd').val();
            const params = {};
            if (searchKw) params.keyword = searchKw;
            if (type && type !== 'all') params.operationType = type;
            if (startDate) params.startDate = startDate;
            if (endDate) params.endDate = endDate;
            currentPage = 1;
            loadLogs(params);
        }

        function filterLogs() { searchLogs(); }

        function resetFilters() {
            $('#logLevel').val('all');
            $('#logType').val('all');
            $('#logUser').val('');
            $('#logKeyword').val('');
            const endDate = new Date();
            const startDate = new Date();
            startDate.setDate(startDate.getDate() - 7);
            document.getElementById("dateRangeStart").valueAsDate = startDate;
            document.getElementById("dateRangeEnd").valueAsDate = endDate;
            currentPage = 1;
            loadLogs();
        }

        async function deleteLog(id) {
            if (!confirm('确定要删除这条日志吗？')) return;
            try {
                await api.del(`${API}/${id}`);
                alert('日志删除成功！');
                loadLogs();
            } catch(e) { alert('删除失败: ' + e.message); }
        }

        async function clearLogs() {
            if (!confirm('确定要清空所有日志吗？此操作不可恢复！')) return;
            try {
                const data = await api.get(API, { pageSize: 1000 });
                const list = api.pageItems(data) || [];
                for (const l of list) {
                    await api.del(`${API}/${l.id}`);
                }
                alert('所有日志已清空！');
                loadLogs();
            } catch(e) { alert('清空失败: ' + e.message); }
        }

        function exportLogs() { alert('导出功能开发中...'); }

        function logout() {
            if (confirm('确定要退出登录吗？')) {
                localStorage.removeItem('token');
                localStorage.removeItem('userInfo');
                localStorage.removeItem('username');
                localStorage.removeItem('selectedRole');
                window.location.href = '/login.html';
            }
        }
    </script>
    <script src="/js/legacy-dynamic-pages.js"></script>
    <script src="/js/chat-widget.js"></script>
</body>
