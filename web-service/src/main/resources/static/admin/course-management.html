    <!-- 添加课程模态框 -->
    <div class="modal" id="addCourseModal">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">添加新课程</h4>
                    <button class="close" data-dismiss="modal"><i class="fas fa-times"></i></button>
                </div>
                <div class="modal-body">
                    <form id="addCourseForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">课程编号</label>
                                    <input type="text" class="form-control" id="courseId" placeholder="请输入课程编号" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">课程名称</label>
                                    <input type="text" class="form-control" id="courseName" placeholder="请输入课程名称" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">授课教师</label>
                                    <select class="form-control" id="courseTeacher" required>
                                        <option value="">请选择教师</option>
                                        <option value="张老师">张老师</option>
                                        <option value="李老师">李老师</option>
                                        <option value="王老师">王老师</option>
                                        <option value="赵老师">赵老师</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">学分</label>
                                    <input type="number" class="form-control" id="courseCredits" min="0.5" max="5" step="0.5" placeholder="请输入学分" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">课程分类</label>
                                    <select class="form-control" id="courseCategory" required>
                                        <option value="必修课">必修课</option>
                                        <option value="选修课">选修课</option>
                                        <option value="专业基础课">专业基础课</option>
                                        <option value="专业课">专业课</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">总人数</label>
                                    <input type="number" class="form-control" id="courseTotal" min="1" placeholder="请输入总人数" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">开设学期</label>
                                    <select class="form-control" id="courseSemester" required>
                                        <option value="2024春季">2024春季</option>
                                        <option value="2024秋季">2024秋季</option>
                                        <option value="2025春季">2025春季</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">上课时间</label>
                                    <input type="text" class="form-control" id="courseTime" placeholder="如：周一 3-4节，周三 5-6节" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">上课地点</label>
                                    <input type="text" class="form-control" id="courseLocation" placeholder="请输入上课地点" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">课程状态</label>
                                    <select class="form-control" id="courseStatus" required>
                                        <option value="normal">正常招生</option>
                                        <option value="full">已满</option>
                                        <option value="closed">已关闭</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">课程描述</label>
                            <textarea class="form-control" id="courseDescription" rows="4" placeholder="请输入课程详细描述"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button class="btn btn-primary" onclick="addCourse()">确认添加</button>
                </div>
            </div>
        </div>
    </div>

        var curPage = 1, pageSize = 6;

        document.addEventListener('DOMContentLoaded', function() {
            loadCourses(1);
            document.getElementById('searchCourseInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') loadCourses(1); });
        });

        async function loadCourses(page) {
            curPage = page;
            var container = document.getElementById('courseListContainer');
            container.innerHTML = '<div class="col-md-12 text-center" style="padding:40px 0;"><i class="fas fa-spinner fa-spin"></i> 加载中...</div>';
            try {
                var data = await api.get('/api/v1/courses/list', { pageNum: curPage, pageSize: pageSize, orderByColumn: 'id', isAsc: true });
                var items = api.pageItems(data), total = api.pageTotal(data);
                if (!items || !items.length) {
                    container.innerHTML = '<div class="col-md-12 text-center text-muted" style="padding:40px 0;">暂无数据</div>';
                } else {
                    container.innerHTML = '';
                    items.forEach(function(c) {
                        var enrolled = c.selectedCount || 0;
                        var totalSlots = c.availableSlots || (enrolled + 10);
                        var progress = totalSlots > 0 ? (enrolled / totalSlots) * 100 : 0;
                        var capClass = progress >= 90 ? 'capacity-low' : (progress >= 70 ? 'capacity-medium' : 'capacity-high');
                        var st = '正常招生', sc = 'badge-success';
                        if (c.status === 2 || c.status === 'closed' || c.status === 'full') { st = '已满'; sc = 'badge-warning'; }
                        else if (c.status === 0) { st = '已关闭'; sc = 'badge-danger'; }
                        var card = document.createElement('div');
                        card.className = 'col-md-6 col-lg-4';
                        card.innerHTML = '<div class="card" style="margin-bottom:16px;"><div class="card-header"><h3 class="card-title" style="font-size:16px;">' + api.escapeHtml(c.courseName || c.courseCode) + '</h3></div><div class="card-body">' +
                            '<p style="color:#6c757d;margin-bottom:8px;">' + api.escapeHtml(c.courseCode || '-') + ' | ' + api.escapeHtml(c.courseType || '-') + ' | ' + (c.credit || '-') + '学分</p>' +
                            '<p style="margin-bottom:6px;"><strong>教师：</strong>' + api.escapeHtml(c.teacherName || c.teacherId || '-') + '</p>' +
                            '<p style="margin-bottom:6px;"><strong>时间：</strong>' + api.escapeHtml(c.schedule || '-') + '</p>' +
                            '<p style="margin-bottom:6px;"><strong>地点：</strong>' + api.escapeHtml(c.classroom || '-') + '</p>' +
                            '<p style="margin-bottom:6px;"><strong>学期：</strong>' + api.escapeHtml(c.semester || '-') + '</p>' +
                            '<div style="margin-bottom:8px;"><div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span>选课进度：</span><span>' + enrolled + '/' + totalSlots + '人</span></div>' +
                            '<div class="capacity-bar"><div class="capacity-progress ' + capClass + '" style="width:' + Math.min(progress, 100) + '%;"></div></div></div>' +
                            '<span class="badge ' + sc + '">' + st + '</span></div>' +
                            '<div class="card-footer" style="display:flex;gap:8px;justify-content:center;">' +
                            '<button class="btn btn-sm btn-info" onclick="showCourseDetail(' + c.id + ')"><i class="fas fa-eye"></i> 详情</button>' +
                            '<button class="btn btn-sm btn-primary" onclick="showEditCourseModal(' + c.id + ')"><i class="fas fa-edit"></i> 编辑</button>' +
                            '<button class="btn btn-sm btn-danger" onclick="deleteCourse(' + c.id + ')"><i class="fas fa-trash"></i> 删除</button></div></div>';
                        container.appendChild(card);
                    });
                }
                renderCoursePagination(total);
            } catch (err) {
                container.innerHTML = '<div class="col-md-12 text-center" style="padding:40px 0;color:#dc3545;">加载失败: ' + api.escapeHtml(err.message) + '</div>';
            }
        }

        function renderCoursePagination(total) {
            var tp = Math.ceil(total / pageSize) || 1;
            var p = document.getElementById('coursePagination');
            var h = '<li class="' + (curPage === 1 ? 'disabled' : '') + '"><a href="#" onclick="loadCourses(1);return false;">&laquo;</a></li>';
            for (var i = 1; i <= tp; i++) {
                if (i === 1 || i === tp || Math.abs(i - curPage) <= 1) {
                    h += '<li class="' + (i === curPage ? 'active' : '') + '"><a href="#" onclick="loadCourses(' + i + ');return false;">' + i + '</a></li>';
                } else if (i === curPage - 2 || i === curPage + 2) { h += '<li class="disabled"><a href="#">...</a></li>'; }
            }
            h += '<li class="' + (curPage === tp ? 'disabled' : '') + '"><a href="#" onclick="loadCourses(' + tp + ');return false;">&raquo;</a></li>';
            p.innerHTML = h;
        }

        function searchCourses() { loadCourses(1); }
        function filterCourses() { loadCourses(1); }

        function showAddCourseModal() { document.getElementById('addCourseForm').reset(); openModal(document.getElementById('addCourseModal')); }

        async function addCourse() {
            var d = { courseCode: document.getElementById('courseId').value.trim(), courseName: document.getElementById('courseName').value.trim(), teacherId: 1, credit: parseFloat(document.getElementById('courseCredits').value) || 0, totalHours: (parseFloat(document.getElementById('courseCredits').value) || 2) * 16, availableSlots: parseInt(document.getElementById('courseTotal').value) || 40, courseType: document.getElementById('courseCategory').value, semester: document.getElementById('courseSemester').value, schedule: document.getElementById('courseTime').value.trim(), classroom: document.getElementById('courseLocation').value.trim(), description: document.getElementById('courseDescription').value.trim(), status: 1 };
            if (!d.courseCode || !d.courseName) { api.notify('warning', '提示', '请填写课程编号和名称'); return; }
            try { await api.post('/api/v1/courses', d); closeModal(document.getElementById('addCourseModal')); api.notify('success', '添加成功', '课程已添加'); loadCourses(1); } catch (e) { api.notify('error', '添加失败', e.message); }
        }

        async function showEditCourseModal(id) {
            try {
                var c = await api.get('/api/v1/courses/' + id);
                document.getElementById('editCourseId').value = c.id;
                document.getElementById('editCourseName').value = c.courseName;
                document.getElementById('editCourseTeacher').value = c.teacherName || c.teacherId || '';
                document.getElementById('editCourseCredits').value = c.credit;
                document.getElementById('editCourseCategory').value = c.courseType || '选修课';
                document.getElementById('editCourseTotal').value = c.availableSlots || 40;
                document.getElementById('editCourseSemester').value = c.semester || '';
                document.getElementById('editCourseTime').value = c.schedule || '';
                document.getElementById('editCourseLocation').value = c.classroom || '';
                document.getElementById('editCourseStatus').value = c.status === 0 ? 'closed' : (c.status === 2 ? 'full' : 'normal');
                document.getElementById('editCourseDescription').value = c.description || '';
                openModal(document.getElementById('editCourseModal'));
            } catch (e) { api.notify('error', '加载失败', e.message); }
        }

        async function updateCourse() {
            var id = document.getElementById('editCourseId').value;
            var d = { courseName: document.getElementById('editCourseName').value.trim(), credit: parseFloat(document.getElementById('editCourseCredits').value) || 0, availableSlots: parseInt(document.getElementById('editCourseTotal').value) || 40, schedule: document.getElementById('editCourseTime').value.trim(), classroom: document.getElementById('editCourseLocation').value.trim(), description: document.getElementById('editCourseDescription').value.trim() };
            try { await api.request('/api/v1/courses/' + id, { method: 'PUT', body: d }); closeModal(document.getElementById('editCourseModal')); api.notify('success', '更新成功', '课程已更新'); loadCourses(curPage); } catch (e) { api.notify('error', '更新失败', e.message); }
        }

        async function deleteCourse(id) {
            if (!confirm('确定要删除该课程吗？')) return;
            try { await api.del('/api/v1/courses/' + id); api.notify('success', '删除成功', '课程已删除'); loadCourses(1); } catch (e) { api.notify('error', '删除失败', e.message); }
        }

        async function showCourseDetail(id) {
            try {
                var c = await api.get('/api/v1/courses/' + id);
                document.getElementById('detailCourseId').textContent = c.courseCode || '-';
                document.getElementById('detailCourseName').textContent = c.courseName;
                document.getElementById('detailCourseTeacher').textContent = c.teacherName || c.teacherId || '-';
                document.getElementById('detailCourseCredits').textContent = (c.credit || '-') + ' 学分';
                document.getElementById('detailCourseCategory').textContent = c.courseType || '-';
                document.getElementById('detailCourseSemester').textContent = c.semester || '-';
                document.getElementById('detailCourseTime').textContent = c.schedule || '-';
                document.getElementById('detailCourseLocation').textContent = c.classroom || '-';
                var enrolled = c.selectedCount || 0;
                var totalSlots = c.availableSlots || (enrolled + 10);
                document.getElementById('detailCourseEnrollment').textContent = enrolled + ' / ' + totalSlots + ' 人';
                var st = '正常招生';
                if (c.status === 2 || c.status === 'closed') st = '已满';
                else if (c.status === 0) st = '已关闭';
                document.getElementById('detailCourseStatus').textContent = st;
                document.getElementById('detailCourseDescription').textContent = c.description || '暂无描述';
                window._detailCourseId = id;
                openModal(document.getElementById('courseDetailModal'));
            } catch (e) { api.notify('error', '加载失败', e.message); }
        }

        function showEnrolledStudents() {
            closeModal(document.getElementById('courseDetailModal'));
            document.getElementById('enrolledStudentsTable').innerHTML = '<tr><td colspan="5" class="text-center" style="padding:20px;">选课学生列表功能开发中</td></tr>';
            openModal(document.getElementById('enrolledStudentsModal'));
        }

        function batchDeleteCourses() { api.notify('info', '批量删除', '请选择要删除的课程'); }
        function exportCourseData() { api.notify('info', '导出', '正在导出...'); }
        function importCourseData(file) { if (file) api.notify('success', '导入成功', '数据已导入'); }
    </script>
</body>
</html>
