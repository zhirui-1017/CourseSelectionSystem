<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程管理 - 教师端</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/teacher-dynamic.css">
</head>
<body class="teacher-page" data-teacher-page="courses">
    <div class="page-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/teacher/index.html" class="sidebar-brand">
                    <div class="sidebar-brand-icon"><i class="fas fa-chalkboard-teacher"></i></div>
                    <span class="sidebar-brand-text">教师端</span>
                </a>
                <button class="sidebar-toggle" type="button" aria-label="收起侧边栏"><i class="fas fa-chevron-left"></i></button>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-item"><a href="/teacher/index.html" class="nav-link"><i class="nav-icon fas fa-house"></i><span class="nav-text">首页</span></a></div>
                <div class="nav-item"><a href="/teacher/course-management.html" class="nav-link active"><i class="nav-icon fas fa-book-open"></i><span class="nav-text">课程管理</span></a></div>
                <div class="nav-item"><a href="/teacher/student-management.html" class="nav-link"><i class="nav-icon fas fa-users"></i><span class="nav-text">学生管理</span></a></div>
                <div class="nav-item"><a href="/teacher/grade-management.html" class="nav-link"><i class="nav-icon fas fa-pen-to-square"></i><span class="nav-text">成绩管理</span></a></div>
                <div class="nav-item"><a href="/teacher/teaching-statistics.html" class="nav-link"><i class="nav-icon fas fa-chart-simple"></i><span class="nav-text">教学统计</span></a></div>
<div class="nav-item"><a href="/teacher/teaching-schedule.html" class="nav-link"><i class="nav-icon fas fa-calendar-alt"></i><span class="nav-text">授课课表</span></a></div>
                <div class="nav-item"><a href="/teacher/personal-info.html" class="nav-link"><i class="nav-icon fas fa-user"></i><span class="nav-text">个人信息</span></a></div>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-navbar">
                <div class="nav-left">
                    <button class="mobile-sidebar-toggle" type="button" aria-label="打开侧边栏"><i class="fas fa-bars"></i></button>
                    <h1 class="page-title">课程管理</h1>
                </div>
                <div class="nav-right">
                    <div class="user-profile">
                        <div class="user-avatar" data-teacher-avatar>师</div>
                        <div class="user-info">
                            <span class="user-name" data-teacher-name>教师</span>
                            <span class="user-role" data-teacher-role>Teacher</span>
                        </div>
                    </div>
                    <a class="btn btn-secondary btn-sm" href="/login/logout"><i class="fas fa-right-from-bracket"></i>退出</a>
                </div>
            </header>

            <div class="content-wrapper">
                <div class="operation-buttons">
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-primary" onclick="showApplyAddCourseModal()">
                            <i class="fas fa-plus"></i> 添加课程
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="showMyApplications()">
                            <i class="fas fa-clipboard-list"></i> 我的申请
                        </button>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">我的课程 <span class="teacher-table-note">共 <strong data-course-count>0</strong> 门</span></h2>
                    </div>
                    <div class="card-body">
                        <div class="teacher-filter">
                            <div class="form-group">
                                <label class="form-label" for="course-search">搜索课程</label>
                                <input id="course-search" class="form-control" type="search" placeholder="课程名称或编号" data-course-search>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="course-status">开放状态</label>
                                <select id="course-status" class="form-control" data-course-status>
                                    <option value="">全部状态</option>
                                    <option value="1">开放</option>
                                    <option value="0">关闭</option>
                                </select>
                            </div>
                            <button class="btn btn-primary" type="button" data-course-filter-button><i class="fas fa-filter"></i>筛选</button>
                        </div>

                        <div class="teacher-course-grid" data-course-list>
                            <div class="teacher-empty"><span class="loading"></span></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 课程申请模态框（添加/编辑共用） -->
    <div class="modal" id="applyCourseModal">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">课程申请</h4>
                    <button class="close" data-dismiss="modal"><i class="fas fa-times"></i></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="applyType" value="add">
                    <input type="hidden" id="applyCourseId">
                    <p class="text-muted" id="applyModalHint" style="margin-bottom:12px;"></p>
                    <form id="applyCourseForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">课程编号</label>
                                    <input type="text" class="form-control" id="applyCourseCode" placeholder="请输入课程编号">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">课程名称 <span style="color:#dc3545;">*</span></label>
                                    <input type="text" class="form-control" id="applyCourseName" placeholder="请输入课程名称">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">学分</label>
                                    <input type="number" class="form-control" id="applyCourseCredits" min="0.5" max="5" step="0.5" placeholder="请输入学分">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">课程分类</label>
                                    <select class="form-control" id="applyCourseCategory">
                                        <option value="专业必修">专业必修</option>
                                        <option value="专业选修" selected>专业选修</option>
                                        <option value="公共必修">公共必修</option>
                                        <option value="公共选修">公共选修</option>
                                        <option value="必修课">必修课</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">总人数</label>
                                    <input type="number" class="form-control" id="applyCourseTotal" min="1" placeholder="请输入总人数">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">开设学期</label>
                                    <select class="form-control" id="applyCourseSemester">
                                        <option value="2025-2026-1" selected>2025-2026-1</option>
                                        <option value="2025-2026-2">2025-2026-2</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">上课时间</label>
                                    <input type="text" class="form-control" id="applyCourseTime" placeholder="如：周一 3-4节">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">上课地点</label>
                                    <input type="text" class="form-control" id="applyCourseLocation" placeholder="请输入上课地点">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">课程状态</label>
                                    <select class="form-control" id="applyCourseStatus">
                                        <option value="normal" selected>正常招生</option>
                                        <option value="closed">已关闭</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">课程描述</label>
                            <textarea class="form-control" id="applyCourseDescription" rows="3" placeholder="请输入课程详细描述"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button class="btn btn-primary" onclick="submitCourseApplication()">提交申请</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 删除课程申请模态框 -->
    <div class="modal" id="applyDeleteModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">删除课程申请</h4>
                    <button class="close" data-dismiss="modal"><i class="fas fa-times"></i></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="applyDeleteId">
                    <p class="text-muted">课程：<strong id="applyDeleteName"></strong></p>
                    <div class="form-group">
                        <label class="form-label">删除理由 <span style="color:#dc3545;">*</span></label>
                        <textarea class="form-control" id="applyDeleteReason" rows="3" placeholder="请写明删除理由，审批通过后系统将通知相关学生重新选课"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button class="btn btn-danger" onclick="submitDeleteApplication()">提交申请</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 我的申请模态框 -->
    <div class="modal" id="myApplicationsModal">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">我的课程申请</h4>
                    <button class="close" data-dismiss="modal"><i class="fas fa-times"></i></button>
                </div>
                <div class="modal-body">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>类型</th>
                                <th>课程</th>
                                <th>说明/理由</th>
                                <th>状态</th>
                                <th>申请时间</th>
                            </tr>
                        </thead>
                        <tbody id="myApplicationTableBody">
                            <tr><td colspan="5" class="text-center" style="padding:20px;">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/app-api.js"></script>
    <script src="/js/teacher-dashboard.js"></script>
</body>
</html>
