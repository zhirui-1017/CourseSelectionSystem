<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教学统计 - 教师管理系统</title>
    <!-- 引入公共CSS -->
    <link rel="stylesheet" href="/css/common.css">
    <!-- 引入Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" media="print" onload="this.media='all'">
    <!-- 引入Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" media="print" onload="this.media='all'">
    <!-- 引入Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js" async></script>
    <style>
        /* 教学统计页面特定样式 */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-backdrop);
            border-radius: var(--radius-lg);
            border: var(--glass-border);
            padding: 1.5rem;
            display: flex;
            align-items: center;
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            margin-right: 1rem;
        }
        
        .stat-info h3 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-primary);
        }
        
        .stat-info p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .chart-container {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-backdrop);
            border-radius: var(--radius-lg);
            border: var(--glass-border);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .chart-title {
            margin: 0;
            color: var(--text-primary);
            font-weight: 600;
        }
        
        .chart-selector {
            display: flex;
            gap: 0.5rem;
        }
        
        .selector-btn {
            padding: 0.3rem 0.8rem;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }
        
        .selector-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        .data-table {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-backdrop);
            border-radius: var(--radius-lg);
            border: var(--glass-border);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .table-container {
            overflow-x: auto;
        }
        
        .data-table h3 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            font-weight: 600;
        }
        
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
            align-items: center;
        }
        
        .filter-item {
            flex: 1;
            min-width: 200px;
        }
        
        .filter-label {
            display: block;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        
        .filter-select,
        .filter-input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        .custom-date-range {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        
        .date-input {
            flex: 1;
        }
        
        .btn-export {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background 0.2s ease;
        }
        
        .btn-export:hover {
            background: #1a73e8;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .stats-container {
                grid-template-columns: 1fr;
            }
            
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .chart-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/teacher/index.html" class="sidebar-brand">
                    <div class="sidebar-brand-icon">
                        <i class="fas fa-chalkboard-teacher"></i>
                    </div>
                    <div class="sidebar-brand-text">教师管理系统</div>
                </a>
                <button class="sidebar-toggle">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>
            
            <nav class="sidebar-nav">
                <div class="nav-item">
                    <a href="/teacher/index.html" class="nav-link">
                        <i class="nav-icon fas fa-home"></i>
                        <span class="nav-text">首页</span>
                    </a>
                </div>
                <div class="nav-item">
                    <a href="/teacher/course-management.html" class="nav-link">
                        <i class="nav-icon fas fa-book"></i>
                        <span class="nav-text">课程管理</span>
                    </a>
                </div>
                <div class="nav-item">
                    <a href="/teacher/student-management.html" class="nav-link">
                        <i class="nav-icon fas fa-users"></i>
                        <span class="nav-text">学生管理</span>
                    </a>
                </div>
                <div class="nav-item">
                    <a href="/teacher/grade-management.html" class="nav-link">
                        <i class="nav-icon fas fa-graduation-cap"></i>
                        <span class="nav-text">成绩管理</span>
                    </a>
                </div>
                <div class="nav-item">
                    <a href="/teacher/teaching-statistics.html" class="nav-link active">
                        <i class="nav-icon fas fa-chart-bar"></i>
                        <span class="nav-text">教学统计</span>
                    </a>
                </div>
                <div class="nav-item">
                    <a href="/teacher/teaching-schedule.html" class="nav-link">
                        <i class="nav-icon fas fa-calendar-alt"></i>
                        <span class="nav-text">授课课表</span>
                    </a>
                </div>
                <div class="nav-item">
                    <a href="/teacher/personal-info.html" class="nav-link">
                        <i class="nav-icon fas fa-user-circle"></i>
                        <span class="nav-text">个人信息</span>
                    </a>
                </div>
            </nav>
        </aside>
        
        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部导航栏 -->
            <nav class="top-navbar">
                <div class="nav-left">
                    <button class="mobile-sidebar-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="page-title">教学统计分析</h1>
                </div>
                <div class="nav-right">
                    <button class="nav-icon-btn">
                        <i class="fas fa-bell"></i>
                    </button>
                    <button class="nav-icon-btn">
                        <i class="fas fa-envelope"></i>
                    </button>
                    <div class="user-profile dropdown">
                        <div class="dropdown-toggle">
                            <div class="user-avatar">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="user-info">
                                <span class="user-name" data-teacher-name>教师</span>
                                <span class="user-role">计算机科学与技术</span>
                            </div>
                        </div>
                        <div class="dropdown-menu">
                            <a href="/teacher/personal-info.html" class="dropdown-item">
                                <i class="fas fa-user-circle"></i> 个人信息
                            </a>
                            <a href="#" class="dropdown-item">
                                <i class="fas fa-cog"></i> 设置
                            </a>
                            <div class="dropdown-divider"></div>
                            <a href="/login/logout" class="dropdown-item">
                                <i class="fas fa-sign-out-alt"></i> 退出登录
                            </a>
                        </div>
                    </div>
                </div>
            </nav>
            
            <!-- 页面内容 -->
            <div class="content-wrapper">
                <!-- 筛选栏 -->
                <div class="filter-bar">
                    <div class="filter-item">
                        <label for="course-select" class="filter-label">选择课程</label>
                        <select id="course-select" class="filter-select">
                            <option value="all">全部课程</option>
                            <option value="CS305">人工智能导论 (CS305)</option>
                            <option value="CS403">机器学习 (CS403)</option>
                            <option value="CS405">深度学习 (CS405)</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label for="semester-select" class="filter-label">选择学期</label>
                        <select id="semester-select" class="filter-select">
                            <option value="current">当前学期 (2024春季)</option>
                            <option value="previous">上一学期 (2023秋季)</option>
                            <option value="last-year">2023学年全年</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label class="filter-label">自定义日期范围</label>
                        <div class="custom-date-range">
                            <input type="date" id="start-date" class="filter-input date-input">
                            <span style="margin: 0 0.5rem; color: var(--text-secondary);">至</span>
                            <input type="date" id="end-date" class="filter-input date-input">
                        </div>
                    </div>
                    <button id="btn-export" class="btn-export ml-auto">
                        <i class="fas fa-download"></i> 导出报告
                    </button>
                </div>
                
                <!-- 统计卡片 -->
                                <div class="stats-container">
                    <div class="stat-card">
                        <div class="stat-icon" style="background-color: #1e88e5;"><i class="fas fa-book"></i></div>
                        <div class="stat-info"><h3>0</h3><p>当前授课门数</p></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="background-color: #43a047;"><i class="fas fa-users"></i></div>
                        <div class="stat-info"><h3>0</h3><p>当前授课学生数</p></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="background-color: #fb8c00;"><i class="fas fa-clock"></i></div>
                        <div class="stat-info"><h3>0</h3><p>本学期教学时长</p></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="background-color: #e53935;"><i class="fas fa-star"></i></div>
                        <div class="stat-info"><h3>-</h3><p>学生评教平均分</p></div>
                    </div>
                </div>

                <!-- 图表区域：左侧两图、右侧两图 -->
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="chart-container">
                            <div class="chart-header">
                                <h3 class="chart-title">成绩分布统计</h3>
                                <div class="chart-selector">
                                    <button class="selector-btn active" data-chart="score-distribution">按等级</button>
                                    <button class="selector-btn" data-chart="score-range">按分数段</button>
                                </div>
                            </div>
                            <div class="chart-area">
                                <canvas id="scoreDistributionChart" height="300"></canvas>
                            </div>
                        </div>
                        <div class="chart-container">
                            <div class="chart-header"><h3 class="chart-title">出勤率统计</h3></div>
                            <div class="chart-area">
                                <canvas id="attendanceChart" height="300"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="chart-container">
                            <div class="chart-header"><h3 class="chart-title">课程评分趋势</h3></div>
                            <div class="chart-area">
                                <canvas id="ratingTrendChart" height="300"></canvas>
                            </div>
                        </div>
                        <div class="chart-container">
                            <div class="chart-header"><h3 class="chart-title">学生成绩对比分析</h3></div>
                            <div class="chart-area">
                                <canvas id="gradeComparisonChart" height="300"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 详细数据表格 -->
                <div class="data-table">
                    <h3>课程详细统计数据</h3>
                    <div class="table-container">
                        <table class="table table-hover table-responsive">
                            <thead>
                                <tr>
                                    <th>课程编号</th>
                                    <th>课程名称</th>
                                    <th>学生总数</th>
                                    <th>平均分</th>
                                    <th>优秀率(≥90分)</th>
                                    <th>及格率(≥60分)</th>
                                    <th>出勤率(%)</th>
                                    <th>评教分数</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- 引入公共JS -->
    <script src="/js/common.js"></script>
    <script src="/js/app-api.js"></script>
    <script src="/js/teacher-dashboard.js"></script>
    <script src="/js/legacy-dynamic-pages.js"></script>
</body>
</html>
