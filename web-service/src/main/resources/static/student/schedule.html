<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的课表 - 学生选课系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .schedule-container {
            background: var(--glass-bg);
            border-radius: var(--radius-lg);
            border: var(--glass-border);
            backdrop-filter: var(--glass-backdrop);
            box-shadow: var(--shadow);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
            overflow-x: auto;
        }
        .schedule-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-md);
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }
        .schedule-title {
            font-size: var(--font-size-lg);
            font-weight: 600;
            margin: 0;
            color: var(--text-primary);
        }
        .schedule-controls {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .schedule-table th, .schedule-table td {
            border: 1px solid var(--border-color);
            text-align: center;
            vertical-align: top;
            min-width: 120px;
            height: 80px;
            padding: 8px;
        }
        .schedule-table th {
            background-color: var(--primary-color-light);
            color: var(--primary-color);
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .schedule-table .time-column {
            width: 80px;
            background-color: var(--gray-100);
            position: sticky;
            left: 0;
            z-index: 1;
        }
        .course-block {
            background: var(--primary-color);
            color: white;
            border-radius: var(--radius-sm);
            padding: 8px;
            font-size: var(--font-size-xs);
            text-align: left;
            box-shadow: var(--shadow-sm);
            margin-bottom: 4px;
        }
        .course-block-title {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }
        .course-block-info {
            font-size: calc(var(--font-size-xs) - 1px);
            opacity: 0.9;
        }
        .empty-slot {
            color: var(--text-secondary);
            font-size: var(--font-size-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        .schedule-table td[data-day]:empty::before {
            content: '—';
            color: var(--text-secondary);
            opacity: .35;
        }
        .course-block.required,
        .course-block { background: var(--primary-color); }
        .course-block.elective { background: #1890ff; }
        .course-block.general { background: var(--success-color); }
        .course-block.public { background: var(--success-color); }
        .course-block { display: block; }
        @media (max-width: 768px) {
            .schedule-container { padding: var(--spacing-sm); }
            .schedule-header { flex-direction: column; align-items: stretch; }
            .schedule-controls { flex-wrap: wrap; justify-content: center; }
            .schedule-table { font-size: var(--font-size-xs); }
            .schedule-table th, .schedule-table td { min-width: 80px; height: 60px; }
            .time-column { min-width: 60px !important; }
            .course-block { font-size: calc(var(--font-size-xs) - 2px); }
        }
        @media print {
            .sidebar, .top-navbar, .schedule-controls { display: none; }
            .main-content { margin-left: 0; padding: 0; }
            .schedule-container { box-shadow: none; border: 1px solid var(--border-color); }
            .course-block { break-inside: avoid; box-shadow: none; border: 1px solid rgba(0, 0, 0, 0.3); }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/student/index.html" class="sidebar-brand">
                    <div class="sidebar-brand-icon"><i class="fas fa-graduation-cap"></i></div>
                    <span class="sidebar-brand-text">选课系统学生端</span>
                </a>
                <button class="sidebar-toggle" aria-label="收起侧边栏"><i class="fas fa-chevron-left"></i></button>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-group">
                    <div class="nav-item"><a href="/student/index.html" class="nav-link"><i class="nav-icon fas fa-home"></i><span class="nav-text">首页</span></a></div>
                    <div class="nav-item"><a href="/student/my-courses.html" class="nav-link"><i class="nav-icon fas fa-book"></i><span class="nav-text">我的课程</span></a></div>
                    <div class="nav-item"><a href="/student/course-selection.html" class="nav-link"><i class="nav-icon fas fa-search"></i><span class="nav-text">课程选择</span></a></div>
                    <div class="nav-item"><a href="/student/schedule.html" class="nav-link active"><i class="nav-icon fas fa-calendar-alt"></i><span class="nav-text">我的课表</span></a></div>
                    <div class="nav-item"><a href="/student/grades.html" class="nav-link"><i class="nav-icon fas fa-chart-line"></i><span class="nav-text">成绩查询</span></a></div>
                    <div class="nav-item"><a href="/student/evaluations.html" class="nav-link"><i class="nav-icon fas fa-star"></i><span class="nav-text">课程评价</span></a></div>
                </div>
                <div class="nav-group">
                    <div class="nav-item"><a href="/student/profile.html" class="nav-link"><i class="nav-icon fas fa-user"></i><span class="nav-text">个人信息</span></a></div>
                    <div class="nav-item"><a href="/student/messages.html" class="nav-link"><i class="nav-icon fas fa-envelope"></i><span class="nav-text">消息通知</span></a></div>
                    <div class="nav-item"><a href="/student/settings.html" class="nav-link"><i class="nav-icon fas fa-cog"></i><span class="nav-text">设置</span></a></div>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-navbar">
                <div class="nav-left">
                    <button class="mobile-sidebar-toggle" aria-label="切换侧边栏"><i class="fas fa-bars"></i></button>
                    <h1 class="page-title">我的课表</h1>
                </div>
                <div class="nav-right">
                    <div class="breadcrumb">
                        <a href="/student/index.html">首页</a>
                        <span class="breadcrumb-separator">/</span>
                        <span class="breadcrumb-current">我的课表</span>
                    </div>
                    <button class="nav-icon-btn" aria-label="通知"><i class="fas fa-bell"></i><span class="badge">0</span></button>
                    <div class="dropdown">
                        <button class="user-profile dropdown-toggle">
                            <div class="user-avatar"><i class="fas fa-user"></i></div>
                            <div class="user-info">
                                <span class="user-name">学生</span>
                                <span class="user-role">学生</span>
                            </div>
                        </button>
                        <div class="dropdown-menu">
                            <a href="/student/profile.html" class="dropdown-item"><i class="fas fa-user"></i> 个人信息</a>
                            <a href="/student/settings.html" class="dropdown-item"><i class="fas fa-cog"></i> 设置</a>
                            <div class="dropdown-divider"></div>
                            <a href="javascript:void(0)" class="dropdown-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> 退出登录</a>
                        </div>
                    </div>
                </div>
            </header>

            <div class="content-wrapper">
                <div class="schedule-container">
                    <div class="schedule-header">
                        <h3 class="schedule-title">我的课表</h3>
                    </div>
                    <table class="schedule-table" id="weekly-schedule">
                        <thead>
                            <tr>
                                <th class="time-column">节次</th>
                                <th>周一</th>
                                <th>周二</th>
                                <th>周三</th>
                                <th>周四</th>
                                <th>周五</th>
                                <th>周六</th>
                                <th>周日</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr data-start="1" data-end="2"><th class="time-column">1-2节</th><td data-day="周一"></td><td data-day="周二"></td><td data-day="周三"></td><td data-day="周四"></td><td data-day="周五"></td><td data-day="周六"></td><td data-day="周日"></td></tr>
                            <tr data-start="3" data-end="4"><th class="time-column">3-4节</th><td data-day="周一"></td><td data-day="周二"></td><td data-day="周三"></td><td data-day="周四"></td><td data-day="周五"></td><td data-day="周六"></td><td data-day="周日"></td></tr>
                            <tr data-start="5" data-end="6"><th class="time-column">5-6节</th><td data-day="周一"></td><td data-day="周二"></td><td data-day="周三"></td><td data-day="周四"></td><td data-day="周五"></td><td data-day="周六"></td><td data-day="周日"></td></tr>
                            <tr data-start="7" data-end="8"><th class="time-column">7-8节</th><td data-day="周一"></td><td data-day="周二"></td><td data-day="周三"></td><td data-day="周四"></td><td data-day="周五"></td><td data-day="周六"></td><td data-day="周日"></td></tr>
                            <tr data-start="9" data-end="10"><th class="time-column">9-10节</th><td data-day="周一"></td><td data-day="周二"></td><td data-day="周三"></td><td data-day="周四"></td><td data-day="周五"></td><td data-day="周六"></td><td data-day="周日"></td></tr>
                            <tr data-start="11" data-end="12"><th class="time-column">11-12节</th><td data-day="周一"></td><td data-day="周二"></td><td data-day="周三"></td><td data-day="周四"></td><td data-day="周五"></td><td data-day="周六"></td><td data-day="周日"></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/app-api.js"></script>
    <script src="/js/legacy-dynamic-pages.js"></script>
    <script>
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                localStorage.removeItem('token');
                localStorage.removeItem('userInfo');
                localStorage.removeItem('username');
                localStorage.removeItem('selectedRole');
                window.location.href = '/login.html';
            }
        }
    </script>
</body>
</html>
