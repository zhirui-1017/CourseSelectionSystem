<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成绩查询 - 学生选课系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }
        .stat-card {
            background: var(--glass-bg);
            border-radius: var(--radius-lg);
            border: var(--glass-border);
            backdrop-filter: var(--glass-backdrop);
            box-shadow: var(--shadow);
            padding: var(--spacing-lg);
            text-align: center;
            transition: transform var(--transition-normal), box-shadow var(--transition-normal);
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }
        .stat-icon {
            font-size: 2rem;
            margin-bottom: var(--spacing-sm);
            color: var(--primary-color);
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
        }
        .stat-label {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
        }
        .filter-bar {
            background: var(--glass-bg);
            border-radius: var(--radius-lg);
            border: var(--glass-border);
            backdrop-filter: var(--glass-backdrop);
            box-shadow: var(--shadow);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-md);
            align-items: center;
        }
        .filter-item {
            display: flex;
            flex-direction: column;
            min-width: 180px;
        }
        .filter-label {
            font-size: var(--font-size-sm);
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xs);
        }
        .filter-select, .filter-input {
            padding: var(--spacing-sm);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background-color: var(--white);
            font-size: var(--font-size-sm);
            transition: border-color var(--transition-normal);
        }
        .filter-select:focus, .filter-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .filter-actions {
            display: flex;
            gap: var(--spacing-sm);
            margin-left: auto;
        }
        .grades-container {
            background: var(--glass-bg);
            border-radius: var(--radius-lg);
            border: var(--glass-border);
            backdrop-filter: var(--glass-backdrop);
            box-shadow: var(--shadow);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }
        .grades-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }
        .grades-title {
            font-size: var(--font-size-lg);
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }
        .grades-actions {
            display: flex;
            gap: var(--spacing-sm);
        }
        .table-responsive {
            overflow-x: auto;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }
        .grades-table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--white);
        }
        .grades-table th {
            background-color: var(--primary-color-light);
            color: var(--primary-color);
            font-weight: 600;
            text-align: left;
            padding: var(--spacing-md);
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .grades-table td {
            padding: var(--spacing-md);
            border-top: 1px solid var(--border-color);
        }
        .grades-table tr:hover {
            background-color: rgba(240, 247, 255, 0.6);
        }
        .grades-table tr:nth-child(even) {
            background-color: var(--gray-50);
        }
        .grade-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: var(--font-size-sm);
            font-weight: 600;
        }
        .grade-badge.A { background-color: rgba(46, 204, 113, 0.2); color: var(--success-color); }
        .grade-badge.B { background-color: rgba(52, 152, 219, 0.2); color: var(--info-color); }
        .grade-badge.C { background-color: rgba(241, 196, 15, 0.2); color: var(--warning-color); }
        .grade-badge.D { background-color: rgba(231, 76, 60, 0.2); color: var(--danger-color); }
        .grade-badge.F { background-color: rgba(149, 165, 166, 0.2); color: var(--gray-600); }
        .grade-details {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .grade-details-content {
            background: var(--glass-bg);
            border-radius: var(--radius-lg);
            border: var(--glass-border);
            backdrop-filter: var(--glass-backdrop);
            box-shadow: var(--shadow-xl);
            padding: var(--spacing-xl);
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .grade-details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
        }
        .grade-details-title {
            font-size: var(--font-size-xl);
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }
        .grade-details-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            padding: var(--spacing-xs);
            transition: color var(--transition-normal);
        }
        .grade-details-close:hover { color: var(--text-primary); }
        .grade-details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }
        .grade-detail-item { margin-bottom: var(--spacing-sm); }
        .grade-detail-label {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xs);
        }
        .grade-detail-value {
            font-size: var(--font-size-md);
            color: var(--text-primary);
            font-weight: 500;
        }
        @media (max-width: 768px) {
            .filter-bar { flex-direction: column; align-items: stretch; }
            .filter-item { width: 100%; }
            .filter-actions { margin-left: 0; justify-content: center; }
            .grades-header { flex-direction: column; align-items: stretch; }
            .grades-actions { justify-content: center; }
            .grade-details-grid { grid-template-columns: 1fr; }
            .stats-cards { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/student/index.html" class="sidebar-brand">
                    <div class="sidebar-brand-icon"><i class="fas fa-graduation-cap"></i></div>
                    <span class="sidebar-brand-text">选课系统学生端</span>
                </a>
                <button class="sidebar-toggle" aria-label="收起侧边栏"><i class="fas fa-chevron-left"></i></button>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-group">
                    <div class="nav-item"><a href="/student/index.html" class="nav-link"><i class="nav-icon fas fa-home"></i><span class="nav-text">首页</span></a></div>
                    <div class="nav-item"><a href="/student/my-courses.html" class="nav-link"><i class="nav-icon fas fa-book"></i><span class="nav-text">我的课程</span></a></div>
                    <div class="nav-item"><a href="/student/course-selection.html" class="nav-link"><i class="nav-icon fas fa-search"></i><span class="nav-text">课程选择</span></a></div>
                    <div class="nav-item"><a href="/student/schedule.html" class="nav-link"><i class="nav-icon fas fa-calendar-alt"></i><span class="nav-text">我的课表</span></a></div>
                    <div class="nav-item"><a href="/student/grades.html" class="nav-link active"><i class="nav-icon fas fa-chart-line"></i><span class="nav-text">成绩查询</span></a></div>
                    <div class="nav-item"><a href="/student/evaluations.html" class="nav-link"><i class="nav-icon fas fa-star"></i><span class="nav-text">课程评价</span></a></div>
                </div>
                <div class="nav-group">
                    <div class="nav-item"><a href="/student/profile.html" class="nav-link"><i class="nav-icon fas fa-user"></i><span class="nav-text">个人信息</span></a></div>
                    <div class="nav-item"><a href="/student/messages.html" class="nav-link"><i class="nav-icon fas fa-envelope"></i><span class="nav-text">消息通知</span></a></div>
                    <div class="nav-item"><a href="/student/settings.html" class="nav-link"><i class="nav-icon fas fa-cog"></i><span class="nav-text">设置</span></a></div>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-navbar">
                <div class="nav-left">
                    <button class="mobile-sidebar-toggle" aria-label="切换侧边栏"><i class="fas fa-bars"></i></button>
                    <h1 class="page-title">成绩查询</h1>
                </div>
                <div class="nav-right">
                    <div class="breadcrumb">
                        <a href="/student/index.html">首页</a>
                        <span class="breadcrumb-separator">/</span>
                        <span class="breadcrumb-current">成绩查询</span>
                    </div>
                    <button class="nav-icon-btn" aria-label="通知"><i class="fas fa-bell"></i><span class="badge">0</span></button>
                    <div class="dropdown">
                        <button class="user-profile dropdown-toggle">
                            <div class="user-avatar"><i class="fas fa-user"></i></div>
                            <div class="user-info">
                                <span class="user-name">学生</span>
                                <span class="user-role">学生</span>
                            </div>
                        </button>
                        <div class="dropdown-menu">
                            <a href="/student/profile.html" class="dropdown-item"><i class="fas fa-user"></i> 个人信息</a>
                            <a href="/student/settings.html" class="dropdown-item"><i class="fas fa-cog"></i> 设置</a>
                            <div class="dropdown-divider"></div>
                            <a href="javascript:void(0)" class="dropdown-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> 退出登录</a>
                        </div>
                    </div>
                </div>
            </header>

            <div class="content-wrapper">
                <!-- 成绩统计卡片 -->
                <div class="stats-cards">
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-chart-pie"></i></div>
                        <div class="stat-value">-</div>
                        <div class="stat-label">当前平均绩点</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-graduation-cap"></i></div>
                        <div class="stat-value">-</div>
                        <div class="stat-label">平均分</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-book"></i></div>
                        <div class="stat-value">0</div>
                        <div class="stat-label">已有成绩课程</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-award"></i></div>
                        <div class="stat-value">0</div>
                        <div class="stat-label">A等级课程</div>
                    </div>
                </div>

                <!-- 筛选栏 -->
                <div class="filter-bar">
                    <div class="filter-item">
                        <div class="filter-label">学期选择</div>
                        <select class="filter-select" id="semester-filter">
                            <option value="all">全部学期</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <div class="filter-label">课程类型</div>
                        <select class="filter-select" id="course-type-filter">
                            <option value="all">全部类型</option>
                            <option value="required">必修课</option>
                            <option value="elective">选修课</option>
                            <option value="general">通识课</option>
                            <option value="professional">专业课</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <div class="filter-label">成绩范围</div>
                        <select class="filter-select" id="grade-range-filter">
                            <option value="all">全部成绩</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                            <option value="F">F</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <div class="filter-label">课程名称</div>
                        <input type="text" class="filter-input" placeholder="搜索课程名称" id="course-name-filter">
                    </div>
                    <div class="filter-actions">
                        <button class="btn btn-primary" type="button">查询</button>
                        <button class="btn btn-outline-secondary" type="button">重置</button>
                    </div>
                </div>

                <!-- 成绩列表 -->
                <div class="grades-container">
                    <div class="grades-header">
                        <h3 class="grades-title">成绩明细</h3>
                        <div class="grades-actions">
                            <button class="btn btn-outline-secondary" type="button"><i class="fas fa-download"></i> 导出成绩</button>
                            <button class="btn btn-outline-secondary" type="button"><i class="fas fa-print"></i> 打印成绩</button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="grades-table">
                            <thead>
                                <tr>
                                    <th>课程代码</th>
                                    <th>课程名称</th>
                                    <th>课程类型</th>
                                    <th>学分</th>
                                    <th>成绩等级</th>
                                    <th>分数成绩</th>
                                    <th>学分绩点</th>
                                    <th>学期</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr><td colspan="9" class="text-center text-muted">加载中...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 成绩详情模态框 -->
                <div class="grade-details">
                    <div class="grade-details-content">
                        <div class="grade-details-header">
                            <h2 class="grade-details-title">成绩详情</h2>
                            <button class="grade-details-close" type="button"><i class="fas fa-times"></i></button>
                        </div>
                        <div class="grade-details-grid"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/app-api.js"></script>
    <script src="/js/legacy-dynamic-pages.js"></script>
    <script>
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                localStorage.removeItem('token');
                localStorage.removeItem('userInfo');
                localStorage.removeItem('username');
                localStorage.removeItem('selectedRole');
                window.location.href = '/login.html';
            }
        }
    </script>
</body>
</html>
