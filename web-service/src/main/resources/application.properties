spring.application.name=web-service
server.port=8080
server.servlet.context-path=/

# 静态资源缓存（开发模式关闭）
spring.web.resources.cache.period=0

# 日志配置
logging.level.org.example.courseselectionsystem=INFO

# 服务注册与发现
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Actuator 监控端点
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Feign 超时配置
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000

# AI 助手配置（通义千问 / DashScope 兼容 OpenAI 格式）
# 安全提醒：API Key 不应明文提交到仓库，请通过环境变量 AI_QWEN_API_KEY 注入
ai.qwen.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
ai.qwen.api-key=${AI_QWEN_API_KEY:}
ai.qwen.model=qwen-plus
