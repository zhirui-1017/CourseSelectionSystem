spring.application.name=gateway-server
server.port=9000

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# ================================================================
# 微服务独立路由（JWT 认证模式）
# 路由顺序很重要：API 路由必须在 /** 通配路由之前
# ================================================================

# Route 0: 用户/认证/角色/权限服务
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/roles/**,/api/v1/permissions/**,/api/v1/messages/**,/api/v1/operation-logs/**,/api/v1/system-settings/**
spring.cloud.gateway.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.name=userServiceCircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.fallbackUri=forward:/fallback

# Route 1: 学生服务
spring.cloud.gateway.routes[1].id=student-service
spring.cloud.gateway.routes[1].uri=lb://student-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/students/**,/api/v1/classes/**
spring.cloud.gateway.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.name=studentServiceCircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.fallbackUri=forward:/fallback

# Route 2: 教师服务
spring.cloud.gateway.routes[2].id=teacher-service
spring.cloud.gateway.routes[2].uri=lb://teacher-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/teachers/**
spring.cloud.gateway.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[2].filters[0].args.name=teacherServiceCircuitBreaker
spring.cloud.gateway.routes[2].filters[0].args.fallbackUri=forward:/fallback

# Route 3: 课程/学院/系部/专业服务
spring.cloud.gateway.routes[3].id=course-service
spring.cloud.gateway.routes[3].uri=lb://course-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/courses/**,/api/v1/colleges/**,/api/v1/departments/**,/api/v1/majors/**,/api/v1/semesters/**,/api/v1/course-announcements/**
spring.cloud.gateway.routes[3].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[3].filters[0].args.name=courseServiceCircuitBreaker
spring.cloud.gateway.routes[3].filters[0].args.fallbackUri=forward:/fallback

# Route 4: 选课/评价/成绩服务
spring.cloud.gateway.routes[4].id=selection-service
spring.cloud.gateway.routes[4].uri=lb://selection-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/selections/**,/api/v1/course-selections/**,/api/v1/evaluations/**,/api/v1/grades/**
spring.cloud.gateway.routes[4].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[4].filters[0].args.name=selectionServiceCircuitBreaker
spring.cloud.gateway.routes[4].filters[0].args.fallbackUri=forward:/fallback

# Route 5: web-service 兜底（静态资源 + 前端页面 + 未知路径）
spring.cloud.gateway.routes[5].id=web-service
spring.cloud.gateway.routes[5].uri=lb://web-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/**
spring.cloud.gateway.routes[5].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[5].filters[0].args.name=webServiceCircuitBreaker
spring.cloud.gateway.routes[5].filters[0].args.fallbackUri=forward:/fallback

# Resilience4j 熔断配置
resilience4j.timelimiter.configs.default.timeout-duration=5s
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
